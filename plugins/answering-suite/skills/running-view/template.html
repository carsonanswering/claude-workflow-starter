<title>Now Running</title>
<style>
  :root {
    --bg: #f4f6f7; --surface: #ffffff; --line: #dde3e6;
    --ink: #1c2b30; --muted: #5c7076; --faint: #8fa0a5;
    --accent: #1f7a6d; --accent-ink: #ffffff;
    --busy: #a36a00; --busy-bg: #f7ecd4;
    --idle: #5c7076; --idle-bg: #e8edee;
    --good: #24734a; --good-bg: #ddeee3;
    --bad: #a63a32; --bad-bg: #f5e0de;
    --stale: #6b5e8f; --stale-bg: #e9e5f2;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #10161a; --surface: #171f24; --line: #263238;
    --ink: #dce6e8; --muted: #91a4aa; --faint: #61757b;
    --accent: #3aa896; --accent-ink: #0c1210;
    --busy: #e0a93e; --busy-bg: #33290f;
    --idle: #91a4aa; --idle-bg: #1f2a2f;
    --good: #55b380; --good-bg: #142b1f;
    --bad: #d97066; --bad-bg: #331715;
    --stale: #a394cf; --stale-bg: #241f33;
  } }
  :root[data-theme="light"] {
    --bg: #f4f6f7; --surface: #ffffff; --line: #dde3e6;
    --ink: #1c2b30; --muted: #5c7076; --faint: #8fa0a5;
    --accent: #1f7a6d; --accent-ink: #ffffff;
    --busy: #a36a00; --busy-bg: #f7ecd4;
    --idle: #5c7076; --idle-bg: #e8edee;
    --good: #24734a; --good-bg: #ddeee3;
    --bad: #a63a32; --bad-bg: #f5e0de;
    --stale: #6b5e8f; --stale-bg: #e9e5f2;
  }
  :root[data-theme="dark"] {
    --bg: #10161a; --surface: #171f24; --line: #263238;
    --ink: #dce6e8; --muted: #91a4aa; --faint: #61757b;
    --accent: #3aa896; --accent-ink: #0c1210;
    --busy: #e0a93e; --busy-bg: #33290f;
    --idle: #91a4aa; --idle-bg: #1f2a2f;
    --good: #55b380; --good-bg: #142b1f;
    --bad: #d97066; --bad-bg: #331715;
    --stale: #a394cf; --stale-bg: #241f33;
  }
  body { background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .stamp { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .tile .n { font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 26px; font-weight: 600; line-height: 1.1; }
  .tile .n.hot { color: var(--busy); }
  .tile .n.accent { color: var(--accent); }
  .tile .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-top: 4px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600; margin: 0 0 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--muted); }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 1.5px 8px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .pill.busy { color: var(--busy); background: var(--busy-bg); }
  .pill.idle { color: var(--idle); background: var(--idle-bg); }
  .pill.done { color: var(--good); background: var(--good-bg); }
  .pill.error { color: var(--bad); background: var(--bad-bg); }
  .pill.stale { color: var(--stale); background: var(--stale-bg); }
  .pill.other { color: var(--accent); background: var(--idle-bg); }
  .job { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .job:last-child { border-bottom: 0; }
  .job .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .job .id { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .job .detail { color: var(--ink); font-size: 13.5px; margin-top: 2px; }
  .job .result { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .job .meta { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-left: auto; }
  .empty { padding: 14px; color: var(--faint); font-size: 13px; }
  footer { color: var(--faint); font-size: 12px; }
  .ago { color: var(--muted); white-space: nowrap; }
</style>
<div class="wrap">
  <header>
    <h1>Now Running</h1>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <section>
    <h2>Sessions</h2>
    <div class="card"><table id="sessions"></table></div>
  </section>
  <section>
    <h2>Background jobs</h2>
    <div class="card" id="jobs"></div>
  </section>
  <section>
    <h2>Stray processes</h2>
    <div class="card" id="strays"></div>
  </section>
  <footer>Refresh from any Claude Code session with <span class="mono">/running-view</span>.</footer>
</div>
<script>
const D = /*__DATA__*/null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(ms) {
  if (!ms) return "—";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 129600) return (s / 3600).toFixed(1).replace(/\.0$/, "") + "h ago";
  return Math.round(s / 86400) + "d ago";
}
function pill(status) {
  const cls = {busy:"busy", idle:"idle", done:"done", error:"error", working:"busy", running:"busy"}[status] || "other";
  return `<span class="pill ${cls}">${esc(status)}</span>`;
}
document.getElementById("stamp").textContent =
  D.host + " · snapshot " + new Date(D.generatedAt).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
const c = D.counts;
document.getElementById("tiles").innerHTML = [
  [c.sessions, "sessions alive", ""],
  [c.busy, "busy now", c.busy ? "hot" : ""],
  [c.runningJobs, "jobs running", c.runningJobs ? "accent" : ""],
  [c.jobs - c.runningJobs, "jobs finished", ""],
  [c.strays, "stray processes", c.strays ? "hot" : ""],
].map(([n, l, cls]) => `<div class="tile"><div class="n ${cls}">${n}</div><div class="l">${l}</div></div>`).join("");
document.getElementById("sessions").innerHTML =
  `<tr><th>Name</th><th>Status</th><th>Where</th><th>Kind</th><th>PID</th><th>Last activity</th></tr>` +
  (D.sessions.map(s => `<tr>
    <td class="mono">${esc(s.name)}</td>
    <td>${pill(s.status)}</td>
    <td class="mono dim">${esc(s.cwd)}</td>
    <td class="dim">${esc(s.kind)}</td>
    <td class="mono dim">${s.pid}</td>
    <td class="ago">${ago(s.updatedAt)}</td>
  </tr>`).join("") || `<tr><td class="empty" colspan="6">No live sessions.</td></tr>`);
document.getElementById("jobs").innerHTML = D.jobs.map(j => `<div class="job">
  <div class="top"><span class="id">${esc(j.id)}</span>${pill(j.state)}
    ${j.inFlight ? `<span class="pill busy">${j.inFlight} in flight</span>` : ""}
    <span class="meta">${j.tokens ? (j.tokens/1000).toFixed(0) + "k tok · " : ""}${ago(j.updatedAt)}</span></div>
  ${j.detail ? `<div class="detail">${esc(j.detail)}</div>` : ""}
  ${j.result ? `<div class="result">${esc(j.result)}</div>` : ""}
</div>`).join("") || `<div class="empty">No background jobs.</div>`;
document.getElementById("strays").innerHTML = D.strays.map(p => `<div class="job">
  <div class="top"><span class="id">pid ${p.pid}</span><span class="pill stale">stray</span>
    <span class="meta">since ${esc(p.started)}</span></div>
  <div class="result mono">${esc(p.cmd)}</div>
</div>`).join("") || `<div class="empty">Nothing forgotten. Clean machine.</div>`;
</script>

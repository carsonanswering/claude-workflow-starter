# sshd hardening for the multi-agent workstation.
#
# Install:  sudo cp 99-agent-workstation.conf /etc/ssh/sshd_config.d/
#           sudo launchctl kickstart -k system/com.openssh.sshd
#
# ORDER MATTERS: enable Remote Login and confirm a key-based login works from
# another machine BEFORE installing this file. It disables password auth, so a
# broken key means SSH is closed until you fix it from the physical console.

PubkeyAuthentication yes

# Keys only. This box runs autonomous agents with repo and gh credentials;
# a guessable password on it is a real exposure.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

PermitRootLogin no
PermitEmptyPasswords no

# Only this account needs remote access.
AllowUsers kai

# Drop dead sessions rather than leaving tmux-attached ghosts around.
ClientAliveInterval 60
ClientAliveCountMax 3

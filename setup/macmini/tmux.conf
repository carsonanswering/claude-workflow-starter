# tmux config for the multi-agent workstation.
# Deployed to ~/.tmux.conf by setup/macmini/bootstrap-remote.sh

# --- terminal fidelity -------------------------------------------------------
# Claude Code's TUI needs truecolor and a fast escape. The default 500ms
# escape-time makes arrow keys and Esc feel broken inside the agent panel.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"
set -sg escape-time 10
set -g focus-events on

# --- scrollback --------------------------------------------------------------
# Agents emit a lot. 50k lines per pane so a fleet's output survives review.
set -g history-limit 50000

# --- usability ---------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S:#W"

# Keep manually-named windows named; agent panes get labelled by hand.
setw -g allow-rename off
setw -g automatic-rename off

# Detaching should not kill the session — the whole point of the agents session.
set -g detach-on-destroy off

# --- status line -------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[default] "
set -g status-right "#[fg=colour245]%H:%M #[fg=colour39]#h "
setw -g window-status-current-style "fg=colour39,bold"

# --- pane splitting keeps the current directory -------------------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
